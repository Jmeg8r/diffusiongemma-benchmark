[project]
name = "diffusiongemma-benchmark"
version = "0.1.0"
description = "Hands-on benchmark: DiffusionGemma vs autoregressive Gemma 4 on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "mlx-vlm>=0.6.3",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
